name: Release Tag

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  # Serialise tag creation. Two runs on the same version can both observe the
  # tag as missing, then race on `git push`; the loser fails and never creates
  # its GitHub Release. cancel-in-progress is false on purpose — a run that has
  # already pushed a tag must be allowed to finish creating the release.
  group: release-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # jq -j plus a sentinel: plain $( ) strips trailing newlines, so a
          # manifest value of "1.2.3\n" would arrive as "1.2.3" and sail past
          # the whitelist below instead of being reported. -j suppresses jq's
          # own newline; the x sentinel preserves any the value really carries.
          VERSION=$(jq -j '.version // empty' package.json; printf 'x'); VERSION=${VERSION%x}
          if [ -z "$VERSION" ]; then
            echo "::error file=package.json::package.json has no \"version\" field."
            exit 1
          fi

          # This value becomes a git tag and a $GITHUB_OUTPUT line, so validate
          # it before use. A whitelist first, because grep is line-oriented and
          # "1.2.3\nskip=true" would match on its first line while injecting a
          # second line into the step output; then a whole-string bash match.
          case "$VERSION" in
            *[!0-9A-Za-z.+-]*)
              echo "::error file=package.json::version contains characters that are not valid in a SemVer string (newlines or control characters?). Refusing to tag."
              exit 1
              ;;
          esac

          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error file=package.json::\"$VERSION\" is not valid SemVer 2.0.0 — refusing to tag."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      # A pre-existing tag has two very different meanings, and the original
      # version of this step treated them the same — reporting success either
      # way. That is how v1.3.1 reached TestFlight untagged: package.json still
      # read 1.3.0, v1.3.0 already existed, so this silently skipped.
      - name: Check if tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # An annotated tag exposes refs/tags/X (the tag object) and
          # refs/tags/X^{} (the commit). Query the peeled ref FIRST — reading
          # refs/tags/X yields the tag object SHA, which never equals
          # GITHUB_SHA, so every correctly tagged release would be reported as
          # untagged. Lightweight tags have no peeled ref, hence the fallback.
          PEELED=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk 'NR==1{print $1}')
          PLAIN=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR==1{print $1}')
          REMOTE="${PEELED:-$PLAIN}"
          if [ -z "$REMOTE" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "No ${TAG} yet — will tag ${GITHUB_SHA}."
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          if [ "$REMOTE" = "$GITHUB_SHA" ]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} already points at ${GITHUB_SHA} — tag is correct."
            exit 0
          fi
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          # Dangerous case: main advanced but the version did not, so whatever
          # just merged is a release that no tag describes.
          echo "::warning::${TAG} already exists at ${REMOTE:0:8}, but this merge is ${GITHUB_SHA:0:8}. This commit is being released UNTAGGED. If it is a real release, bump the version (package.json and app.json together) and merge again."
          {
            echo "### :warning: Release is untagged"
            echo ""
            echo "\`${TAG}\` already points at \`${REMOTE:0:8}\`, but this merge is \`${GITHUB_SHA:0:8}\`."
            echo ""
            echo "The version was not bumped, so no tag describes what just shipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # Gated on conflict, not on exists: tag push and release creation are two
      # operations, so if the push succeeds and this fails, a re-run must still
      # be able to finish rather than skipping forever.
      - name: Create GitHub Release
        if: steps.check_tag.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — nothing to do."
            exit 0
          fi
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes

      - name: Comment backport reminder for hotfixes
        if: steps.check_tag.outputs.exists == 'false' && startsWith(github.event.pull_request.head.ref, 'hotfix/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "**Hotfix released as v${{ steps.version.outputs.version }}.** Remember to backport this to the active \`dev-v*\` branch."
