name: Production CI

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize]

concurrency:
  group: prod-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: TypeScript check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The outstanding HIGH advisories all chain through @expo/config-plugins
      # (build-time tooling, never shipped in the JS bundle) and are only
      # fixable via a breaking Expo SDK upgrade, which the 1.2.0 hotfix line
      # cannot take — so we accept HIGH by auditing at the `critical` level
      # (which passes high findings). CRITICAL advisories must still fail the
      # build, so there is deliberately no `continue-on-error` here.
      # Re-tighten to `--audit-level=high` once the 1.3.0 line (with upgraded
      # deps) becomes the production branch.
      - name: Security audit
        run: npm audit --audit-level=critical

  auto-format:
    name: Auto-fix Formatting
    runs-on: ubuntu-latest
    needs: [quality]
    if: success()
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Auto-fix formatting
        continue-on-error: true
        run: |
          npm run format
          npm run lint:fix

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'style: auto-fix formatting and linting issues'
          branch: ${{ github.head_ref }}
