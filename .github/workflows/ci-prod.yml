name: Production CI

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize]

concurrency:
  group: prod-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Advisory-only, matching ci.yml: the outstanding high advisories all
      # chain through @expo/config-plugins (build-time tooling, never shipped
      # in the JS bundle) and are only fixable via a breaking Expo SDK
      # upgrade, which the 1.2.0 hotfix line cannot take. Re-tighten once the
      # 1.3.0 line (with upgraded deps) becomes the production branch.
      - name: Security audit
        continue-on-error: true
        run: npm audit --audit-level=high

  auto-format:
    name: Auto-fix Formatting
    runs-on: ubuntu-latest
    needs: [quality]
    if: success()
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Auto-fix formatting
        continue-on-error: true
        run: |
          npm run format
          npm run lint:fix

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'style: auto-fix formatting and linting issues'
          branch: ${{ github.head_ref }}
