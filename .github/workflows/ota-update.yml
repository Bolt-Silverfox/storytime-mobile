name: OTA Update

# Publishes an expo-updates OTA to the production channel whenever main
# changes. runtimeVersion policy is appVersion, so this reaches only clients
# whose installed app version matches the version in app.json on main —
# JS-only changes ship instantly without a store release.
#
# EXPO_PUBLIC_* values are inlined into the bundle at export time, so the
# publish step reconstructs the production env: the non-secret values come
# from eas.json's production build profile (single source of truth), and
# EXPO_PUBLIC_API_KEY comes from a repository secret (it is deliberately not
# committed).
#
# Required repository secrets:
#   EXPO_TOKEN           - Expo access token with access to net.emerj.storytime
#   EXPO_PUBLIC_API_KEY  - the backend X-API-Key value baked into client bundles

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ota-production
  cancel-in-progress: false

jobs:
  ota:
    name: Publish OTA (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require secrets
        env:
          EXPO_TOKEN_SET: ${{ secrets.EXPO_TOKEN != '' }}
          API_KEY_SET: ${{ secrets.EXPO_PUBLIC_API_KEY != '' }}
        run: |
          ok=true
          [ "$EXPO_TOKEN_SET" = "true" ] || { echo "::error::EXPO_TOKEN secret is not set."; ok=false; }
          [ "$API_KEY_SET" = "true" ] || { echo "::error::EXPO_PUBLIC_API_KEY secret is not set — publishing without it would ship a bundle that omits the X-API-Key header."; ok=false; }
          $ok

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create production .env
        run: |
          jq -r '.build.production.env | to_entries[] | "\(.key)=\(.value)"' eas.json > .env
          echo "EXPO_PUBLIC_API_KEY=${{ secrets.EXPO_PUBLIC_API_KEY }}" >> .env
          echo "Bundled env keys:"; cut -d= -f1 .env

      - name: Publish update
        run: |
          eas update --branch production --non-interactive \
            --message "${GITHUB_SHA::8}: $(git log -1 --pretty=%s)"
