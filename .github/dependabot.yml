version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    # Expo SDK 56 pins the version of every package below -- the list is
    # generated from `expo/bundledNativeModules.json`, which is what
    # `npx expo install --fix` reads. Dependabot cannot know those pins, so a
    # lone bump desynchronises the package from the installed SDK.
    #
    # All update types are ignored, not just majors: Expo pins several of these
    # exactly (react 19.2.3, react-native 0.85.3, react-native-screens 4.25.2,
    # react-native-reanimated 4.3.1, react-native-worklets 0.8.3), so even a
    # patch moves them off the pin. The SDK upgrade is the update mechanism.
    #
    # @react-native/jest-preset is not in bundledNativeModules but is coupled to
    # the react-native version: its moduleNameMapper points into react-native's
    # internals, so 0.88 against RN 0.85.3 fails with
    # "Could not locate module react-native/asset-registry".
    ignore:
      - dependency-name: '@expo/vector-icons'
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@react-native-community/netinfo'
      - dependency-name: '@react-native-masked-view/masked-view'
      - dependency-name: '@sentry/react-native'
      - dependency-name: '@shopify/flash-list'
      - dependency-name: 'expo-application'
      - dependency-name: 'expo-asset'
      - dependency-name: 'expo-audio'
      - dependency-name: 'expo-blur'
      - dependency-name: 'expo-build-properties'
      - dependency-name: 'expo-checkbox'
      - dependency-name: 'expo-clipboard'
      - dependency-name: 'expo-constants'
      - dependency-name: 'expo-crypto'
      - dependency-name: 'expo-dev-client'
      - dependency-name: 'expo-device'
      - dependency-name: 'expo-font'
      - dependency-name: 'expo-image-manipulator'
      - dependency-name: 'expo-image-picker'
      - dependency-name: 'expo-keep-awake'
      - dependency-name: 'expo-linear-gradient'
      - dependency-name: 'expo-linking'
      - dependency-name: 'expo-notifications'
      - dependency-name: 'expo-secure-store'
      - dependency-name: 'expo-splash-screen'
      - dependency-name: 'expo-status-bar'
      - dependency-name: 'expo-updates'
      - dependency-name: 'jest-expo'
      - dependency-name: 'lottie-react-native'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-screens'
      - dependency-name: 'react-native-svg'
      - dependency-name: 'react-native-worklets'
      - dependency-name: '@react-native/jest-preset'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'ci'
